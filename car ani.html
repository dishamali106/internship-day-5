<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moving Car with Spinning Wheels</title>
  <style>
    body {
      margin: 0;
      background: #87ceeb;
      overflow: hidden;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: #2f2f2f;
    }

    .car {
      position: absolute;
      bottom: 120px;
      width: 300px;
      animation: moveCar 5s linear infinite;
    }

    .car-body {
      width: 100%;
    }

    .wheel {
      position: absolute;
      width: 60px;
      animation: spin 5s linear infinite;
    }

    .front-wheel {
      bottom: -1px;
      left: 21px;
    }

    .rear-wheel {
      bottom: -1px;
      right: 28px;
    }

    @keyframes moveCar {
      0% {
        left: -350px;
      }
      100% {
        left: 100%;
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(180deg);
      }
    }
  </style>
</head>
<body>

  <div class="road"></div>

  <div class="car">
    <img src="car.png" alt="Car body" class="car-body">
    <img src="wheel.png" alt="Front wheel" class="wheel front-wheel">
    <img src="wheel.png" alt="Rear wheel" class="wheel rear-wheel">
  </div>

</body>
</html>
